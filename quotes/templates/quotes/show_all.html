{% extends 'quotes/base.html' %}

{% block title %}All Quotes{% endblock %}

{% block content %}
    <h2>All Quotes</h2>
    {% for q in quotes %}
        <blockquote><p>"{{ q }}"</p></blockquote>
    {% endfor %}

    <h2>All Images</h2>
    {% for img in images %}
        <img src="{{ img }}" alt="Muhammad Ali" width="200">
    {% endfor %}
{% endblock %}
